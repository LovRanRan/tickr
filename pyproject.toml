[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tickr"
version = "0.1.0"
description = "Async multi-source price tracker CLI — Phase 1 mini-project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "David" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]
stretch = [
    "rich>=13.7.0",
]

[project.scripts]
tickr = "tickr.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tickr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
